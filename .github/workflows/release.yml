name: SNNotes Windows Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installers and create release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri Windows application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || 'v1.0.0' }}
          releaseName: 'SNNotes ${{ github.ref_name || 'v1.0.0' }}'
          releaseBody: 'Snake Nation SNNotes Windows release: .msi and NSIS .exe installers. Neural notes organizer with chrono alarms and synthesized SFX.'
          releaseDraft: false
          prerelease: false
